---
apiVersion: batch/v1
kind: Job
metadata:
  name: mc-user-create-job-first-run
  namespace: minio-tenant-default
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  template:
    spec:
      containers:
        - command:
            - bash
            - /mnt/scripts/mc-user-create.sh
          image: minio/mc:latest
          name: mc
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - mountPath: /tmp/minio-config
              name: configuration
            - mountPath: /tmp/minio-user
              name: user
            - mountPath: /mnt/scripts/
              name: script
      restartPolicy: Never
      volumes:
        - configMap:
            name: mc-user-create-cm
          name: script
        - name: configuration
          projected:
            defaultMode: 420
            sources:
              - secret:
                  name: default-minio-tenant-env-configuration
        - name: user
          projected:
            defaultMode: 448
            sources:
              - secret:
                  name: default-user
