---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Best Practices, EKS Best Practices
    policies.kyverno.io/description: As application workloads share cluster resources, it is important to limit resources requested and consumed by each Pod. It is recommended to require resource requests and limits per Pod, especially for memory and CPU. If a Namespace level request or limit is specified, defaults will automatically be applied to each Pod based on the LimitRange configuration. This policy validates that all containers have something specified for memory and CPU requests and memory limits.
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Require Limits and Requests
  name: require-requests-limits
spec:
  background: true
  rules:
    - exclude:
        any:
          - resources:
              namespaces:
                - argocd
                - cf-gitea
                - kube-amd-gpu
                - longhorn
                - minio-operator
                - external-secrets
                - kgateway-system
                - kueue-system
                - metallb-system
                - minio-tenant-default
                - cert-manager
                - kuberay-operator
                - otel-lgtm-stack
                - csi-wekafs
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
                - UPDATE
      name: validate-resources
      validate:
        foreach:
          - list: request.object.spec.containers
            pattern:
              resources:
                limits:
                  memory: ?*
                requests:
                  cpu: ?*
                  memory: ?*
            preconditions:
              all:
                - key: '{{ element.image }}'
                  operator: NotEquals
                  value: docker.io/istio*
                - key: '{{ element.image }}'
                  operator: NotEquals
                  value: docker.io/semitechnologies*
                - key: '{{ element.image }}'
                  operator: NotEquals
                  value: docker.io/liquibase*
                - key: '{{ element.image }}'
                  operator: NotEquals
                  value: percona/*
                - key: '{{ element.image }}'
                  operator: NotEquals
                  value: rabbitmq*
                - key: '{{ element.image }}'
                  operator: NotEquals
                  value: ghcr.io/cloudnative-pg*
                - key: '{{ element.image }}'
                  operator: NotEquals
                  value: gcr.io/knative-releases*
        message: Memory resource limits and CPU and memory resource requests are required.
  validationFailureAction: Enforce
