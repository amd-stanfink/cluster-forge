---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app: csi-wekafs-controller
    component: csi-wekafs-controller
    release: csi-wekafs
  name: csi-wekafs-controller
  namespace: csi-wekafs
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - watch
      - list
      - delete
      - update
      - create
