    listKind: MultiKueueConfigList
    plural: multikueueconfigs
    singular: multikueueconfig
  scope: Cluster
  versions:
    - name: v1beta1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              properties:
                clusters:
                  items:
                    type: string
                  maxItems: 10
                  minItems: 1
