---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    release: prometheus
  name: ray-workers-monitor
  namespace: prometheus-system
spec:
  jobLabel: ray-workers
  namespaceSelector:
    matchNames:
      - default
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_label_ray_io_cluster
          targetLabel: ray_io_cluster
  selector:
    matchLabels:
      ray.io/node-type: worker
