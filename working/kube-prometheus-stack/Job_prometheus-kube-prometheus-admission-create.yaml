---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: kube-prometheus-stack-admission-create
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/version: 48.2.1
    chart: kube-prometheus-stack-48.2.1
    heritage: Helm
    release: prometheus
  name: prometheus-kube-prometheus-admission-create
  namespace: prometheus-system
spec:
  template:
    metadata:
      labels:
        app: kube-prometheus-stack-admission-create
        app.kubernetes.io/instance: prometheus
        app.kubernetes.io/part-of: kube-prometheus-stack
        app.kubernetes.io/version: 48.2.1
        chart: kube-prometheus-stack-48.2.1
        heritage: Helm
        release: prometheus
      name: prometheus-kube-prometheus-admission-create
    spec:
      containers:
        - args:
            - create
            - --host=prometheus-kube-prometheus-operator,prometheus-kube-prometheus-operator.prometheus-system.svc
            - --namespace=prometheus-system
            - --secret-name=prometheus-kube-prometheus-admission
          image: registry.k8s.io/ingress-nginx/kube-webhook-certgen:v20221220-controller-v1.5.1-58-g787ea74b6
          imagePullPolicy: IfNotPresent
          name: create
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: prometheus-kube-prometheus-admission
