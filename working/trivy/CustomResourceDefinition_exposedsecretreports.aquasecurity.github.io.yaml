---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: exposedsecretreports.aquasecurity.github.io
spec:
  group: aquasecurity.github.io
  names:
    kind: ExposedSecretReport
    listKind: ExposedSecretReportList
    plural: exposedsecretreports
    shortNames:
      - exposedsecret
      - exposedsecrets
    singular: exposedsecretreport
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .report.artifact.repository
          name: Repository
          type: string
        - jsonPath: .report.artifact.tag
          name: Tag
          type: string
        - jsonPath: .report.scanner.name
          name: Scanner
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        - jsonPath: .report.summary.criticalCount
          name: Critical
          priority: 1
          type: integer
        - jsonPath: .report.summary.highCount
          name: High
          priority: 1
          type: integer
        - jsonPath: .report.summary.mediumCount
          name: Medium
          priority: 1
          type: integer
        - jsonPath: .report.summary.lowCount
          name: Low
          priority: 1
          type: integer
      name: v1alpha1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            report:
              properties:
                artifact:
                  properties:
                    digest:
                      type: string
                    mimeType:
                      type: string
                    repository:
                      type: string
                    tag:
                      type: string
                  type: object
                registry:
                  properties:
                    server:
                      type: string
                  type: object
                scanner:
                  properties:
                    name:
                      type: string
                    vendor:
                      type: string
                    version:
                      type: string
                  required:
                    - name
                    - vendor
                    - version
                  type: object
                secrets:
                  items:
                    properties:
                      category:
                        type: string
                      match:
                        type: string
                      ruleID:
                        type: string
                      severity:
                        enum:
                          - CRITICAL
                          - HIGH
                          - MEDIUM
                          - LOW
                        type: string
                      target:
                        type: string
                      title:
                        type: string
                    required:
                      - category
                      - match
                      - ruleID
                      - severity
                      - target
                      - title
                    type: object
                  type: array
                summary:
                  properties:
                    criticalCount:
                      minimum: 0
                      type: integer
                    highCount:
                      minimum: 0
                      type: integer
                    lowCount:
                      minimum: 0
                      type: integer
                    mediumCount:
                      minimum: 0
                      type: integer
                  required:
                    - criticalCount
                    - highCount
                    - lowCount
                    - mediumCount
                  type: object
                updateTimestamp:
                  format: date-time
                  type: string
              required:
                - artifact
                - scanner
                - secrets
                - summary
                - updateTimestamp
              type: object
          required:
            - report
          type: object
          x-kubernetes-preserve-unknown-fields: true
      served: true
      storage: true
      subresources: {}
