                      type: array
                    id:
                      type: string
                    title:
                      type: string
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                updateTimestamp:
                  format: date-time
                  type: string
              required:
                - updateTimestamp
              type: object
          type: object
          x-kubernetes-preserve-unknown-fields: true
      served: true
      storage: true
      subresources:
        status: {}
