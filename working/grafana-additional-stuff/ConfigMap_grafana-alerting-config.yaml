  templates.yaml: |
    apiVersion: 1
    templates:
      - name: test-temp-3
        orgID: 1
        type: alert
        template: |-
          {{ define "test-temp-3" -}}
          *Alert:* {{ .CommonLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          *Total Alerts:* {{ len .Alerts }}
          *Dashboard URL:* {{ (index .Alerts 0).DashboardURL }}
          *Cluster:* {{ .CommonLabels.cluster_name}}
          *Namespace:* {{ .CommonLabels.namespace}}

          {{- range .Alerts }}
          *Start Time:* {{ .StartsAt }}

          *Labels:*
          {{- if .Labels.node_name }}
           - node_name: {{ .Labels.node_name }}
          {{- end }}
          {{- if .Labels.pod }}
           - pod: {{ .Labels.pod }}
          {{- end }}
          {{- if .Labels.severity }}
           - severity: {{ .Labels.severity }}
          {{- end }}

          {{ end -}}
          {{ end }}
kind: ConfigMap
metadata:
  name: grafana-alerting-config
  namespace: grafana
  labels:
    grafana_alerting: "1"
