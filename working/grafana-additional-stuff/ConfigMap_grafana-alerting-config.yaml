---
apiVersion: v1
data:
  contactpoints.yaml: "apiVersion: 1\ncontactPoints:\n  - orgId: 1\n    name: 'new-test-contact-point-for-oci-clusters'\n    receivers:\n      - uid: slack_webhook_test_channel ##\n        type: slack\n        settings:\n          recipient: \"silogen-grafana-alert-test\"\n          url: ${SLACK_CONTACT_POINT_TEST_URL} \n          title: \"Direct alert to slack\"\n          text: '{{ template \"test-temp-3\" . }}'\n"
  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: grafana-default-email ##
        group_wait: 30s
        group_interval: 10m
        repeat_interval: 10m
        group_by:
          - grafana_folder
          - alertname
        routes:
          - receiver: new-test-contact-point-for-oci-clusters
            object_matchers:
              - - k8s_cluster_name
                - =~
                - oci
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: EVERY_MINUTE_EVALUTION
        folder: GPU_alerts
        interval: 1m
        rules:
          - uid: cem1zmkyqo1kwb
            title: GPU General Usage Hig Utilization - WARNING
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: oci-clusters-mimir
                model:
                  disableTextWrap: false
                  editorMode: builder
                  expr: avg(gpu_gfx_activity{k8s_cluster_name="oci1"})
                  fullMetaSearch: false
                  includeNullMetadata: true
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
                  useBackend: false
              - refId: C
                datasourceUid: __expr__
                model:
                  conditions:
                      - evaluator:
                          params:
                              - 90
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                              - C
                        reducer:
                          params: []
                          type: last
                        type: query
                  datasource:
                      type: __expr__
                      uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 1m
            isPaused: false
            notification_settings:
              receiver: new-test-contact-point-for-oci-clusters
